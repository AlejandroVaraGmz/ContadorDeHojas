<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metal1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="1"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Industrial Hazard Stripe Accents (Top corners) -->
  <path d="M 60 40 L 100 40 L 40 100 L 40 60 Z" fill="#eab308" opacity="0.8"/>
  <path d="M 120 40 L 160 40 L 40 160 L 40 120 Z" fill="#eab308" opacity="0.8"/>

  <!-- Metal Sheets Stack Representation -->
  <!-- Sheet 1 (Top) -->
  <rect x="96" y="140" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="140" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="159" width="320" height="3" fill="#1e293b"/>

  <!-- Sheet 2 -->
  <rect x="96" y="176" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="176" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="195" width="320" height="3" fill="#1e293b"/>

  <!-- Sheet 3 -->
  <rect x="96" y="212" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="212" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="231" width="320" height="3" fill="#1e293b"/>

  <!-- Sheet 4 -->
  <rect x="96" y="248" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="248" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="267" width="320" height="3" fill="#1e293b"/>

  <!-- Sheet 5 -->
  <rect x="96" y="284" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="284" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="303" width="320" height="3" fill="#1e293b"/>

  <!-- Sheet 6 (Bottom) -->
  <rect x="96" y="320" width="320" height="22" rx="4" fill="url(#metal1)"/>
  <rect x="96" y="320" width="320" height="3" fill="#ffffff" opacity="0.9"/>
  <rect x="96" y="339" width="320" height="3" fill="#1e293b"/>

  <!-- Corrugated Cardboard Texture Guide (Top and Bottom) -->
  <path d="M 96 115 Q 112 125 128 115 T 160 115 T 192 115 T 224 115 T 256 115 T 288 115 T 320 115 T 352 115 T 384 115 T 416 115" 
        fill="none" stroke="#b45309" stroke-width="4" opacity="0.75"/>
  <path d="M 96 365 Q 112 375 128 365 T 160 365 T 192 365 T 224 365 T 256 365 T 288 365 T 320 365 T 352 365 T 384 365 T 416 365" 
        fill="none" stroke="#b45309" stroke-width="4" opacity="0.75"/>

  <!-- Measurement Caliper / ROI Brackets -->
  <path d="M 120 120 L 76 120 L 76 360 L 120 360" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 392 120 L 436 120 L 436 360 L 392 360" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>

  <!-- Green Neon Laser Scanner Line -->
  <line x1="60" y1="235" x2="452" y2="235" stroke="#22c55e" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Counter Marker Dots -->
  <circle cx="256" cy="151" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="256" cy="187" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="256" cy="223" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="256" cy="259" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="256" cy="295" r="7" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="256" cy="331" r="7" fill="#22c55e" filter="url(#glow)"/>

  <!-- Badge / Count Pill at Bottom -->
  <rect x="156" y="405" width="200" height="52" rx="26" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#22c55e" text-anchor="middle" letter-spacing="1.5">
    COUNT: 6
  </text>
</svg>
